name: Build Windows & macOS

on:
  workflow_dispatch:
    inputs:
      targets:
        description: 要打包的平台
        type: choice
        default: all
        options:
          - all
          - windows
          - macos
      publish_release:
        description: 是否同时发布为 GitHub Release
        type: boolean
        default: true
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64 (.exe)
    runs-on: windows-latest
    timeout-minutes: 45
    if: >
      github.event_name != 'workflow_dispatch' ||
      inputs.targets == 'all' ||
      inputs.targets == 'windows'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm@10.17.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Windows x64 (.exe)
        env:
          M_ARCH: x64
          npm_config_arch: x64
          USE_HARD_LINKS: false
        run: pnpm run dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: PunPun-windows-x64
          path: build/*.exe
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: Build (${{ matrix.label }})
    runs-on: macos-latest
    timeout-minutes: 45
    if: >
      github.event_name != 'workflow_dispatch' ||
      inputs.targets == 'all' ||
      inputs.targets == 'macos'

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon (arm64 .dmg/.zip)
            arch: arm64
            native_arch: arm64
            artifact_name: PunPun-macos-arm64
          - label: macOS Intel (x64 .dmg/.zip)
            arch: x64
            native_arch: arm64
            artifact_name: PunPun-macos-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm@10.17.0

      - name: Install dependencies (native)
        if: matrix.arch == matrix.native_arch
        run: pnpm install --frozen-lockfile

      - name: Install dependencies (cross-arch)
        if: matrix.arch != matrix.native_arch
        run: pnpm install --force --frozen-lockfile

      - name: Build ${{ matrix.label }}
        env:
          M_ARCH: ${{ matrix.arch }}
          npm_config_arch: ${{ matrix.arch }}
          USE_HARD_LINKS: false
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm run dist

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            build/*.dmg
            build/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Release
    needs:
      - build-windows
      - build-macos
    if: >
      always() &&
      needs.build-windows.result != 'failure' &&
      needs.build-windows.result != 'cancelled' &&
      needs.build-macos.result != 'failure' &&
      needs.build-macos.result != 'cancelled' &&
      (needs.build-windows.result == 'success' || needs.build-macos.result == 'success') &&
      (startsWith(github.ref, 'refs/tags/') || inputs.publish_release)
    runs-on: ubuntu-latest

    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-artifacts/**
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('punpun-v0.2.0-build-{0}', github.run_number) }}
          prerelease: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
