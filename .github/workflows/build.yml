name: Build & Publish Packages

on:
  push:
    branches:
      - main
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      targets:
        description: 要打包的平台
        type: choice
        default: all
        options:
          - all
          - windows
          - macos
      publish_release:
        description: 是否同时发布到 GitHub Release 与软件包 (Packages)
        type: boolean
        default: true

concurrency:
  group: build-publish-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build-windows:
    name: Build Windows x64 (.exe)
    runs-on: windows-latest
    timeout-minutes: 45
    if: >
      github.event_name != 'workflow_dispatch' ||
      inputs.targets == 'all' ||
      inputs.targets == 'windows'

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm & resolve store path
        shell: bash
        run: |
          npm install -g pnpm@10.17.0
          echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-${{ runner.os }}-x64-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-x64-

      - name: Cache Electron & runtime assets
        uses: actions/cache@v5
        with:
          path: |
            ~/AppData/Local/electron/Cache
            ~/AppData/Local/electron-builder/Cache
            assets/onnx
            assets/bergamot
            assets/fonts
            lib/copy.exe
          key: build-assets-win-x64-${{ hashFiles('package.json', 'electron-builder.config.js') }}
          restore-keys: |
            build-assets-win-x64-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Build Windows x64 (.exe)
        env:
          M_ARCH: x64
          npm_config_arch: x64
          USE_HARD_LINKS: false
        run: pnpm run dist

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v7
        with:
          name: PunPun-windows-x64
          path: build/*.exe
          if-no-files-found: error
          retention-days: 30

  build-macos:
    name: Build (${{ matrix.label }})
    runs-on: macos-latest
    timeout-minutes: 45
    if: >
      github.event_name != 'workflow_dispatch' ||
      inputs.targets == 'all' ||
      inputs.targets == 'macos'

    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS Apple Silicon (arm64 .dmg/.zip)
            arch: arm64
            native_arch: arm64
            artifact_name: PunPun-macos-arm64
          - label: macOS Intel (x64 .dmg/.zip)
            arch: x64
            native_arch: arm64
            artifact_name: PunPun-macos-x64

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm & resolve store path
        shell: bash
        run: |
          npm install -g pnpm@10.17.0
          echo "PNPM_STORE_PATH=$(pnpm store path --silent)" >> "$GITHUB_ENV"

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: pnpm-${{ runner.os }}-${{ matrix.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            pnpm-${{ runner.os }}-${{ matrix.arch }}-
            pnpm-${{ runner.os }}-

      - name: Cache Electron & runtime assets
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
            assets/onnx
            assets/bergamot
            assets/fonts
          key: build-assets-mac-${{ matrix.arch }}-${{ hashFiles('package.json', 'electron-builder.config.js') }}
          restore-keys: |
            build-assets-mac-${{ matrix.arch }}-
            build-assets-mac-

      - name: Install dependencies (native)
        if: matrix.arch == matrix.native_arch
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: Install dependencies (cross-arch)
        if: matrix.arch != matrix.native_arch
        run: pnpm install --force --frozen-lockfile --prefer-offline

      - name: Build ${{ matrix.label }}
        env:
          M_ARCH: ${{ matrix.arch }}
          npm_config_arch: ${{ matrix.arch }}
          USE_HARD_LINKS: false
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: pnpm run dist

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            build/*.dmg
            build/*.zip
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish GitHub Packages & Release
    needs:
      - build-windows
      - build-macos
    if: >
      always() &&
      needs.build-windows.result != 'failure' &&
      needs.build-windows.result != 'cancelled' &&
      needs.build-macos.result != 'failure' &&
      needs.build-macos.result != 'cancelled' &&
      (needs.build-windows.result == 'success' || needs.build-macos.result == 'success') &&
      (github.event_name != 'workflow_dispatch' || inputs.publish_release)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Read package version
        id: meta
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            TAG_NAME="v${VERSION}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"

      - name: Download packaged artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist-artifacts
          merge-multiple: true

      - name: Publish to GitHub Packages (GHCR)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          REPO_LOWER=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          cat > Dockerfile.pkg <<EOF
          FROM scratch
          LABEL org.opencontainers.image.title="PunPun"
          LABEL org.opencontainers.image.description="PunPun v${{ steps.meta.outputs.version }} 正式版安装包（Windows .exe / macOS .dmg & .zip）"
          LABEL org.opencontainers.image.version="${{ steps.meta.outputs.version }}"
          LABEL org.opencontainers.image.source="https://github.com/${{ github.repository }}"
          LABEL org.opencontainers.image.licenses="GPL-3.0"
          COPY dist-artifacts/ /packages/
          EOF
          docker build -f Dockerfile.pkg \
            -t "ghcr.io/${REPO_LOWER}:${{ steps.meta.outputs.version }}" \
            -t "ghcr.io/${REPO_LOWER}:latest" \
            .
          docker push "ghcr.io/${REPO_LOWER}:${{ steps.meta.outputs.version }}"
          docker push "ghcr.io/${REPO_LOWER}:latest"

      - name: Publish Official GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist-artifacts/**
          name: PunPun ${{ steps.meta.outputs.tag_name }} 正式版
          tag_name: ${{ steps.meta.outputs.tag_name }}
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: false
          make_latest: true
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
